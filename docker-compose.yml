
services:

  # ─── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: memorytwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memorytwin
      POSTGRES_PASSWORD: memorytwin_pass
      POSTGRES_DB: memorytwin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorytwin -d memorytwin_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - memorytwin_net

  # ─── Neo4j ───────────────────────────────────────────────────────
  # NOTE: APOC plugin removed — it triggers a large separate download
  # that frequently causes TLS timeouts on restricted networks.
  # All graph features work without APOC via raw Cypher queries.
  neo4j:
    image: neo4j:5.20-community
    container_name: memorytwin_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/memorytwin_neo4j
      # Memory limits tuned for development machines (4GB+ RAM recommended)
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (used by Python driver)
    healthcheck:
      # Simpler HTTP check — avoids needing cypher-shell binary
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - memorytwin_net

  # ─── Ollama / Llama 3 ────────────────────────────────────────────
  # Starts Ollama server, then pulls llama3 in the background.
  # The backend gracefully falls back if the model isn't ready yet.
  ollama:
    image: ollama/ollama:latest
    container_name: memorytwin_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - memorytwin_net
    # Serve first, pull model in background so compose doesn't block on first boot
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3 && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  # ─── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorytwin_backend
    restart: on-failure:5
    env_file:
      # Optional local override — won't fail if missing
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://memorytwin:memorytwin_pass@postgres:5432/memorytwin_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memorytwin_neo4j
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3
      OLLAMA_REQUEST_TIMEOUT: "180"
      OLLAMA_HEALTH_TIMEOUT: "90"
      OLLAMA_NUM_PREDICT: "256"
      OLLAMA_MAX_RETRIES: "3"
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app          # Live code reload in dev
      - ml_models:/app/ml       # Persist trained ML models
      - datasets:/app/datasets  # Persist generated datasets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started   # Don't block on neo4j — backend handles reconnect
      ollama:
        condition: service_started
    networks:
      - memorytwin_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── React Frontend (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memorytwin_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - memorytwin_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ─── Named Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  ml_models:
  datasets:

# ─── Networks ─────────────────────────────────────────────────────
networks:
  memorytwin_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
