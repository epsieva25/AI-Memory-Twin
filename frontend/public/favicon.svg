  <path d="M50 45 Q44 42 40 48 M50 45 Q56 42 60 48" stroke="rgba(226,232,240,0.5)" stroke-width="1.2" fill="none"/>
  <path d="M38 55 Q42 58 50 55 Q58 58 62 55" stroke="rgba(226,232,240,0.4)" stroke-width="1.2" fill="none"/>
