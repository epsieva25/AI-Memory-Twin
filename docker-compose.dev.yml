# ==============================================================
#  docker-compose.dev.yml  —  Lightweight Dev Environment
# ==============================================================
#
#  Use this when the full docker-compose.yml is too heavy to pull
#  (TLS timeouts on Ollama/Neo4j images, slow networks, etc.)
#
#  What runs:
#    ✅ PostgreSQL  — full DB, health-checked
#    ✅ FastAPI     — backend with auto-reload
#    ⏭️  Neo4j      — optional (graph falls back to mock data)
#    ⏭️  Ollama     — not started (AI tutor uses fallback responses)
#    ⏭️  Frontend   — use:  npm run dev  (already running)
#
#  Usage:
#    docker compose -f docker-compose.dev.yml up --build -d
#    docker compose -f docker-compose.dev.yml logs backend -f
#    docker compose -f docker-compose.dev.yml down
#

services:

  # ─── PostgreSQL (required) ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: memorytwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memorytwin
      POSTGRES_PASSWORD: memorytwin_pass
      POSTGRES_DB: memorytwin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorytwin -d memorytwin_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - memorytwin_net

  # ─── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorytwin_backend
    restart: on-failure:3
    environment:
      # Point to postgres container
      DATABASE_URL: postgresql://memorytwin:memorytwin_pass@postgres:5432/memorytwin_db
      # Neo4j disabled in dev mode — service uses fallback mock data
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memorytwin_neo4j
      # Ollama disabled — LLM service returns fallback study tips
      OLLAMA_HOST: http://localhost:11434
      OLLAMA_MODEL: llama3
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app           # Live reload — edit code without rebuild
      - ml_models:/app/ml
      - datasets:/app/datasets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - memorytwin_net

volumes:
  postgres_data:
  ml_models:
  datasets:

networks:
  memorytwin_net:
    driver: bridge